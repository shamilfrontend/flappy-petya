<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#00A196" />
    <link rel="icon" href="%BASE_URL%favicon.ico" sizes="any" />
    <link rel="icon" href="%BASE_URL%favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="%BASE_URL%favicon-32x32.png" type="image/png" sizes="32x32" />
    <link rel="icon" href="%BASE_URL%favicon-16x16.png" type="image/png" sizes="16x16" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" sizes="180x180" />
    <link rel="manifest" href="%BASE_URL%site.webmanifest" />
    <link
      rel="preload"
      href="%BASE_URL%static/goose.webp"
      as="image"
      type="image/webp"
    />
    <link
      rel="preload"
      href="%BASE_URL%static/goose.png"
      as="image"
      type="image/png"
    />
    <title>Flappy Petya</title>
    <link rel="stylesheet" href="/src/styles/main.css" />
  </head>
  <body>
    <div
      id="game-announcer"
      class="sr-only"
      aria-live="polite"
      aria-atomic="true"
    ></div>
    <div
      id="app-loader"
      class="app-loader"
      role="status"
      aria-live="polite"
      aria-busy="true"
      aria-label="Загрузка игры"
    >
      <div class="app-loader__content">
        <div class="app-loader__spinner" aria-hidden="true"></div>
        <p class="app-loader__text">Загрузка...</p>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
